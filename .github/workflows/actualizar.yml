name: Actualizar noticias
on:
  schedule:
    - cron: "0 12 * * *"   # 6:00 a. m. en Monclova (UTC-6)
  workflow_dispatch:        # permite ejecución manual
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar script
        run: python3 scripts/actualizar.py
      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet || (git commit -m "Actualizar noticias" && git push)
